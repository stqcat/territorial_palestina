name: Desplega a GitHub Pages

# Només manual: el contingut encara és esborrany i no volem que cap push
# a main torni a publicar el lloc. Per tornar-ho a automatitzar, afegeix
# dues línies aquí sota:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una desplegada a la vegada, sense cancel·lar-ne cap a mitges
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construeix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22

  desplega:
    needs: construeix
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegada.outputs.page_url }}
    steps:
      - id: desplegada
        uses: actions/deploy-pages@v4
